name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check generated theme files are up to date
        run: node scripts/build.mjs --check

      - uses: microsoft/setup-msbuild@v3

      - name: Build VSIX
        run: msbuild Kyokko.slnx /v:m -restore /p:Configuration=Release /p:DeployExtension=false /p:OutDir=${{ github.workspace }}\_built\

      - uses: actions/upload-artifact@v4
        with:
          name: Kyokko.vsix
          path: _built/*.vsix
